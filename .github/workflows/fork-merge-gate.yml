name: Merge gate

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review finished
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Wait for the review of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISPATCHED_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER: chatgpt-codex-connector[bot]
          DEADLINE_MINUTES: "35"
        run: |
          set -euo pipefail
          pr="${DISPATCHED_PR:-$EVENT_PR}"
          if [ -n "$DISPATCHED_PR" ]; then
            head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          else
            head="$EVENT_SHA"
          fi
          echo "pr=$pr head=$head"
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          while :; do
            state="$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
              --jq "[.[] | select(.user.login == \"$REVIEWER\")
                | select(.body | contains(\"codex-review-state:v1\"))
                | .body] | last // \"\"" \
              | sed -n 's/.*codex-review-state:v1 \(.*\) -->.*/\1/p')"
            if [ -n "$state" ]; then
              reviewed="$(jq -r '.code_review.commit_sha // ""' <<<"$state")"
              status="$(jq -r '.code_review.status // ""' <<<"$state")"
              unresolved="$(jq -r '.code_review.has_unresolved_findings' <<<"$state")"
              echo "reviewed=$reviewed status=$status unresolved=$unresolved"
              if [ "$reviewed" = "$head" ] && [ "$status" = "completed" ]; then
                if [ "$unresolved" != "false" ]; then
                  echo "::error::Codex review of $head is not clear"
                  exit 1
                fi
                echo "::notice::Codex reviewed $head with no unresolved finding"
                exit 0
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No finished Codex review of $head within $DEADLINE_MINUTES minutes"
              exit 1
            fi
            sleep 30
          done

  automerge:
    name: Enable auto-merge
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge once the required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISPATCHED_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          pr="${DISPATCHED_PR:-$EVENT_PR}"
          if [ -n "$DISPATCHED_PR" ]; then
            author="$(gh api "repos/$REPO/pulls/$pr" --jq .user.login)"
            labels="$(gh api "repos/$REPO/pulls/$pr" --jq '[.labels[].name] | join(",")')"
          else
            author="$EVENT_AUTHOR"
            labels="$EVENT_LABELS"
          fi
          case ",$labels," in *,automerge,*) ;; *)
            case "$author" in *"[bot]") ;; *)
              echo "::notice::$author has to merge this one"
              exit 0
            esac
          esac
          gh pr merge "$pr" --repo "$REPO" --merge --auto --delete-branch \
            || gh pr merge "$pr" --repo "$REPO" --merge --auto
