name: macOS self-signed requirement probe

on:
  pull_request:
    branches: [main, maintenance]
    paths:
      - scripts/macos-self-signed-requirement-probe.sh
      - .github/workflows/macos-self-signed-requirement-probe.yml

permissions:
  contents: read

concurrency:
  group: macos-self-signed-requirement-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirement:
    name: Designated requirement of two self-signed bundles
    if: github.repository == 'Paper-blue/openbot'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the probe
        shell: bash
        run: bash scripts/macos-self-signed-requirement-probe.sh

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-self-signed-requirement-probe
          path: .openbot-build/macos-self-signed-requirement-probe.json
          if-no-files-found: warn
