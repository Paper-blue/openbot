name: Maintenance controller checks

on:
  pull_request:
    branches: [main, maintenance]
    paths:
      - .github/automation/**
      - .github/workflows/fork-*.yml
      - scripts/fork-maintenance-e2e.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-tests:
    name: Maintenance controller process checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the controller against a local HTTP service and Git repository
        run: python3 scripts/fork-maintenance-e2e.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: maintenance-controller-report
          path: .openbot-build/fork-maintenance-e2e/report.json
          if-no-files-found: error
